<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Dark Mode</title>
  <style>
    body { transition: background-color 0.3s; }
    body { background-color: #f8f8f8; color: #333; }
    body.dark { background-color: #1a1a1a; color: #eee; }
  </style>
</head>
<body>
  <h1>Test Dark Mode (No Tailwind)</h1>
  <p>Click button to toggle</p>
  <button onclick="document.body.classList.toggle('dark')">Toggle</button>
</body>
</html>
